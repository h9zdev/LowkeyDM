<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LowkeyDM</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>LowkeyDM</h2>
        <p>Set a shared secret password with your chat partner to encrypt and decrypt messages.</p>
        
        <div class="form-group">
            <label for="password">Secret Password:</label>
            <input type="password" id="password" placeholder="Enter shared secret..." />
        </div>
        
        <button id="save-btn">Save Key</button>
        <div id="status"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
